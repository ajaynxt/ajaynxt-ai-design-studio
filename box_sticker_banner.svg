<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stickerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#D71920"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Shadow filter for sticker depth -->
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>

    <filter id="ribbonShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Circular text paths -->
    <!-- Top arc: Radius = 190, Center = (250, 250) -->
    <path id="topTextArc" d="M 60,250 A 190,190 0 0,1 440,250" fill="none"/>
    <!-- Bottom arc: Radius = 190, Center = (250, 250) (Clockwise for bottom text) -->
    <path id="bottomTextArc" d="M 440,250 A 190,190 0 0,1 60,250" fill="none"/>
  </defs>

  <style>
    .font-heavy { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; }
    .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 600; }
  </style>

  <!-- Group with sticker shadow -->
  <g filter="url(#stickerShadow)">
    
    <!-- Outer Cut/Peel Border -->
    <circle cx="250" cy="250" r="236" fill="#FFFFFF"/>
    
    <!-- Perforated / Dashed Stitch Line (Box Packaging Style) -->
    <circle cx="250" cy="250" r="230" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- Main Circular Body -->
    <circle cx="250" cy="250" r="220" fill="url(#stickerBg)"/>

    <!-- Inner Gold Ring -->
    <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
    <circle cx="250" cy="250" r="162" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Top Curved Text -->
    <text fill="#FFFFFF" class="font-bold" font-size="22" letter-spacing="4">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        ★ PREMIUM QUALITY SEAL ★
      </textPath>
    </text>

    <!-- Bottom Curved Text -->
    <text fill="#FED7AA" class="font-medium" font-size="19" letter-spacing="3.5">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        • PACKED WITH 100% CARE •
      </textPath>
    </text>

    <!-- Star Badges on Left and Right -->
    <circle cx="78" cy="250" r="8" fill="#FDE047"/>
    <circle cx="422" cy="250" r="8" fill="#FDE047"/>

    <!-- Center Icon Area (Diamond / Shield Motif) -->
    <g transform="translate(250, 160)">
      <!-- Diamond Glow -->
      <polygon points="0,-32 30,0 0,32 -30,0" fill="url(#goldGradient)" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.3))"/>
      <polygon points="0,-22 20,0 0,22 -20,0" fill="#FFFFFF" opacity="0.9"/>
      <!-- Small Sparkles -->
      <path d="M-45,-10 L-40,-5 L-45,0 L-50,-5 Z" fill="#FDE047"/>
      <path d="M45,-10 L50,-5 L45,0 L40,-5 Z" fill="#FDE047"/>
    </g>

    <!-- Horizontal Center Ribbon / Banner for Box -->
    <g filter="url(#ribbonShadow)">
      <!-- Ribbon Ends (Folded 3D look) -->
      <polygon points="25,250 55,225 55,275" fill="#7F1D1D"/>
      <polygon points="475,250 445,225 445,275" fill="#7F1D1D"/>

      <!-- Main Banner Plate -->
      <rect x="42" y="222" width="416" height="56" rx="6" fill="url(#bannerGrad)" stroke="url(#goldGradient)" stroke-width="2.5"/>

      <!-- Banner Text -->
      <text x="250" y="258" text-anchor="middle" fill="#0F172A" class="font-heavy" font-size="26" letter-spacing="3">
        ORIGINAL &amp; FRESH
      </text>
    </g>

    <!-- Sub-tagline below ribbon -->
    <text x="250" y="318" text-anchor="middle" fill="#FFFFFF" class="font-bold" font-size="16" letter-spacing="2">
      VERIFIED PACKAGING
    </text>
    
    <!-- Guarantee Checkmark Pill -->
    <g transform="translate(250, 354)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="rgba(0, 0, 0, 0.25)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
      <!-- Checkmark -->
      <path d="M-60,0 L-54,6 L-44,-4" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="4" y="5" text-anchor="middle" fill="#F8FAFC" class="font-bold" font-size="12" letter-spacing="1.5">
        TAMPER PROOF
      </text>
    </g>

  </g>
</svg>
