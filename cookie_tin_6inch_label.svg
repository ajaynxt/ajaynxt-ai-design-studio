<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- Background Matte Mint/Teal Gradient matching the physical tin -->
    <radialGradient id="tinTealBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#88BCBA"/>
      <stop offset="60%" stop-color="#72A7A5"/>
      <stop offset="100%" stop-color="#5E9492"/>
    </radialGradient>

    <!-- Metallic Warm Antique Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4"/>
      <stop offset="25%" stop-color="#E5C170"/>
      <stop offset="50%" stop-color="#CFA14B"/>
      <stop offset="75%" stop-color="#E8CA7D"/>
      <stop offset="100%" stop-color="#BA8C37"/>
    </linearGradient>

    <linearGradient id="goldFoilLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0BE"/>
      <stop offset="50%" stop-color="#E2BD6C"/>
      <stop offset="100%" stop-color="#F5DB8E"/>
    </linearGradient>

    <!-- Subtle gold emboss drop shadow -->
    <filter id="goldEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#3D6866" flood-opacity="0.85"/>
      <feDropShadow dx="-0.5" dy="-0.5" stdDeviation="0.4" flood-color="#FFFFFF" flood-opacity="0.35"/>
    </filter>

    <!-- Circular Text Paths (Center at 600, 600) -->
    <!-- Top Micro Header Arc: R = 445 -->
    <path id="microTopArc" d="M 210,600 A 390,390 0 0,1 990,600" fill="none"/>
    <!-- Top Main Brand Arc: R = 350 -->
    <path id="brandTopArc" d="M 180,600 A 420,420 0 0,1 1020,600" fill="none"/>
    <!-- Bottom Subtitle Arc: R = 360 -->
    <path id="subBottomArc" d="M 970,600 A 370,370 0 0,1 230,600" fill="none"/>
    <!-- Bottom Main Title Arc: R = 425 -->
    <path id="titleBottomArc" d="M 1030,600 A 430,430 0 0,1 170,600" fill="none"/>

    <!-- Reusable Victorian Filigree Lace Unit (36 copies rotated by 10 deg) -->
    <g id="laceFlourish">
      <!-- Main curling bud -->
      <path d="M 0,-528 C -7,-536 -14,-531 -12,-520 C -10,-510 0,-506 0,-496 C 0,-506 10,-510 12,-520 C 14,-531 7,-536 0,-528 Z" fill="url(#goldFoil)"/>
      <!-- S-curl side leaves -->
      <path d="M -2,-515 C -12,-518 -22,-510 -20,-498 C -19,-490 -12,-486 -5,-490 C -9,-494 -8,-502 -2,-505 Z" fill="url(#goldFoil)"/>
      <path d="M 2,-515 C 12,-518 22,-510 20,-498 C 19,-490 12,-486 5,-490 C 9,-494 8,-502 2,-505 Z" fill="url(#goldFoil)"/>
      <!-- Small decorative berry dot -->
      <circle cx="0" cy="-544" r="3" fill="url(#goldFoil)"/>
      <circle cx="-16" cy="-528" r="2.2" fill="url(#goldFoil)"/>
      <circle cx="16" cy="-528" r="2.2" fill="url(#goldFoil)"/>
    </g>
  </defs>

  <style>
    .font-brand {
      font-family: "Georgia", "Baskerville", "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: 0.18em;
    }
    .font-engraved {
      font-family: "Georgia", "Baskerville", "Times New Roman", serif;
      font-weight: 900;
      letter-spacing: 0.12em;
    }
    .font-sans-micro {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }
    .font-script {
      font-family: "Brush Script MT", "Snell Roundhand", "Baskerville", cursive, serif;
      font-style: italic;
    }
  </style>

  <!-- 1. BASE BACKGROUND (6-Inch Circle) -->
  <circle cx="600" cy="600" r="590" fill="url(#tinTealBg)"/>
  
  <!-- Subtle tin rim bevel -->
  <circle cx="600" cy="600" r="588" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2.5"/>
  <circle cx="600" cy="600" r="584" fill="none" stroke="rgba(60,100,98,0.3)" stroke-width="2"/>

  <!-- Outer Fine Gold Inset Rings -->
  <circle cx="600" cy="600" r="562" fill="none" stroke="url(#goldFoil)" stroke-width="2.5" filter="url(#goldEmboss)"/>
  <circle cx="600" cy="600" r="556" fill="none" stroke="url(#goldFoil)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 2. INTRICATE VICTORIAN LACE WREATH (Rotated 36 times around 360 deg) -->
  <g filter="url(#goldEmboss)">
    <!-- Repeat pattern around center (600,600) -->
    <g transform="translate(600,600)">
      <use href="#laceFlourish"/>
      <use href="#laceFlourish" transform="rotate(10)"/>
      <use href="#laceFlourish" transform="rotate(20)"/>
      <use href="#laceFlourish" transform="rotate(30)"/>
      <use href="#laceFlourish" transform="rotate(40)"/>
      <use href="#laceFlourish" transform="rotate(50)"/>
      <use href="#laceFlourish" transform="rotate(60)"/>
      <use href="#laceFlourish" transform="rotate(70)"/>
      <use href="#laceFlourish" transform="rotate(80)"/>
      <use href="#laceFlourish" transform="rotate(90)"/>
      <use href="#laceFlourish" transform="rotate(100)"/>
      <use href="#laceFlourish" transform="rotate(110)"/>
      <use href="#laceFlourish" transform="rotate(120)"/>
      <use href="#laceFlourish" transform="rotate(130)"/>
      <use href="#laceFlourish" transform="rotate(140)"/>
      <use href="#laceFlourish" transform="rotate(150)"/>
      <use href="#laceFlourish" transform="rotate(160)"/>
      <use href="#laceFlourish" transform="rotate(170)"/>
      <use href="#laceFlourish" transform="rotate(180)"/>
      <use href="#laceFlourish" transform="rotate(190)"/>
      <use href="#laceFlourish" transform="rotate(200)"/>
      <use href="#laceFlourish" transform="rotate(210)"/>
      <use href="#laceFlourish" transform="rotate(220)"/>
      <use href="#laceFlourish" transform="rotate(230)"/>
      <use href="#laceFlourish" transform="rotate(240)"/>
      <use href="#laceFlourish" transform="rotate(250)"/>
      <use href="#laceFlourish" transform="rotate(260)"/>
      <use href="#laceFlourish" transform="rotate(270)"/>
      <use href="#laceFlourish" transform="rotate(280)"/>
      <use href="#laceFlourish" transform="rotate(290)"/>
      <use href="#laceFlourish" transform="rotate(300)"/>
      <use href="#laceFlourish" transform="rotate(310)"/>
      <use href="#laceFlourish" transform="rotate(320)"/>
      <use href="#laceFlourish" transform="rotate(330)"/>
      <use href="#laceFlourish" transform="rotate(340)"/>
      <use href="#laceFlourish" transform="rotate(350)"/>
    </g>

    <!-- Inner boundary lace ring -->
    <circle cx="600" cy="600" r="482" fill="none" stroke="url(#goldFoil)" stroke-width="2.5"/>
    <circle cx="600" cy="600" r="476" fill="none" stroke="url(#goldFoil)" stroke-width="1.2" stroke-dasharray="4 4"/>
  </g>

  <!-- 3. TOP CURVED BRAND HEADER (Exact Hadji Bey's Typographic Style) -->
  <g filter="url(#goldEmboss)">
    <!-- Micro curved subtitle -->
    <text fill="url(#goldFoilLight)" class="font-sans-micro" font-size="16">
      <textPath href="#microTopArc" startOffset="50%" text-anchor="middle">
        • HAND MADE  •  ESTABLISHED 2026 •
      </textPath>
    </text>

    <!-- Main Curved Brand Name (with Victorian drop-line/inline depth) -->
    <!-- Shadow inline effect -->
    <text fill="rgba(60,100,98,0.7)" class="font-engraved" font-size="78">
      <textPath href="#brandTopArc" startOffset="50%" text-anchor="middle">
        DIAMOND&apos;S
      </textPath>
    </text>
    <!-- Foreground Gold text -->
    <text fill="url(#goldFoil)" class="font-engraved" font-size="76" dy="-2">
      <textPath href="#brandTopArc" startOffset="50%" text-anchor="middle">
        DIAMOND&apos;S
      </textPath>
    </text>
  </g>

  <!-- 4. CENTER MONOGRAM SEAL & CALLIGRAPHIC SWASHES -->
  <g filter="url(#goldEmboss)" transform="translate(600, 485)">
    <!-- Left Calligraphic Swirl with floral terminal -->
    <path d="M -75,0 C -120,-8 -170,-35 -200,-10 C -225,12 -210,48 -175,54 C -140,58 -105,42 -65,30 C -30,20 -15,10 0,0" 
          fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -200,-10 C -220,-24 -245,-15 -250,5 C -254,22 -238,36 -220,32 C -208,28 -205,18 -212,12" 
          fill="none" stroke="url(#goldFoil)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Left flower flourish tip -->
    <circle cx="-252" cy="5" r="4.5" fill="url(#goldFoil)"/>
    <circle cx="-244" cy="18" r="3" fill="url(#goldFoil)"/>

    <!-- Right Calligraphic Swirl with floral terminal -->
    <path d="M 75,0 C 120,-8 170,-35 200,-10 C 225,12 210,48 175,54 C 140,58 105,42 65,30 C 30,20 15,10 0,0" 
          fill="none" stroke="url(#goldFoil)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 200,-10 C 220,-24 245,-15 250,5 C 254,22 238,36 220,32 C 208,28 205,18 212,12" 
          fill="none" stroke="url(#goldFoil)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Right flower flourish tip -->
    <circle cx="252" cy="5" r="4.5" fill="url(#goldFoil)"/>
    <circle cx="244" cy="18" r="3" fill="url(#goldFoil)"/>

    <!-- Center Double-Ring Oval Monogram (Exact Hadji Bey's "HBC" Medallion Style) -->
    <!-- Outer oval -->
    <ellipse cx="0" cy="0" rx="76" ry="52" fill="#71A5A3" stroke="url(#goldFoil)" stroke-width="3.5"/>
    <ellipse cx="0" cy="0" rx="70" ry="46" fill="none" stroke="url(#goldFoilLight)" stroke-width="1.5"/>

    <!-- Inside Monogram: DRC (Diamond Restaurant & Confectionery) / DBC (Diamond Butter Cookies) -->
    <text x="0" y="14" text-anchor="middle" fill="url(#goldFoil)" class="font-engraved" font-size="40" letter-spacing="3">
      DBC
    </text>

    <!-- Net Weight below medallion (Exact Hadji Bey's "250ge" Style) -->
    <text x="0" y="88" text-anchor="middle" fill="url(#goldFoilLight)" class="font-brand" font-size="46" font-weight="700">
      250g<tspan font-size="34">℮</tspan>
    </text>
  </g>

  <!-- 5. BOTTOM CURVED PRODUCT TITLE (Exact Hadji Bey's "MADAGASCAR VANILLA FUDGE" Style) -->
  <g filter="url(#goldEmboss)">
    <!-- Subtitle curved line: "HANDCRAFTED IN SHIMLA" or "BAKED WITH PURE BUTTER" -->
    <text fill="url(#goldFoilLight)" class="font-engraved" font-size="28" letter-spacing="4">
      <textPath href="#subBottomArc" startOffset="50%" text-anchor="middle">
        BAKED WITH PURE BUTTER
      </textPath>
    </text>

    <!-- Main Grand Product Title: "BUTTER COOKIES" with vintage inline woodblock engraving -->
    <!-- Base inline shadow -->
    <text fill="rgba(60,100,98,0.7)" class="font-engraved" font-size="82">
      <textPath href="#titleBottomArc" startOffset="50%" text-anchor="middle">
        BUTTER COOKIES
      </textPath>
    </text>
    <!-- Top Gold Foil Text -->
    <text fill="url(#goldFoil)" class="font-engraved" font-size="80" dy="-2">
      <textPath href="#titleBottomArc" startOffset="50%" text-anchor="middle">
        BUTTER COOKIES
      </textPath>
    </text>

    <!-- Inner Hatch / Shading Lines for Engraved Font Luxury Look -->
    <text fill="none" stroke="url(#tinTealBg)" stroke-width="1.8" stroke-dasharray="2 3" class="font-engraved" font-size="80" dy="-2">
      <textPath href="#titleBottomArc" startOffset="50%" text-anchor="middle">
        BUTTER COOKIES
      </textPath>
    </text>
  </g>

  <!-- 6. CURVED TAGLINE BANNER RIBBON (The chosen tagline) -->
  <g filter="url(#goldEmboss)" transform="translate(600, 680)">
    <!-- Small star pair -->
    <text x="0" y="-15" text-anchor="middle" fill="url(#goldFoilLight)" font-size="14" letter-spacing="8">
      ★  ★  ★
    </text>
    <!-- Tagline: "Handcrafted with Love" -->
    <text x="0" y="10" text-anchor="middle" fill="url(#goldFoil)" class="font-script" font-size="28">
      Handcrafted with Love
    </text>
    <!-- Fine underline with center diamond -->
    <line x1="-120" y1="22" x2="-15" y2="22" stroke="url(#goldFoil)" stroke-width="1.5"/>
    <polygon points="0,17 5,22 0,27 -5,22" fill="url(#goldFoil)"/>
    <line x1="15" y1="22" x2="120" y2="22" stroke="url(#goldFoil)" stroke-width="1.5"/>
  </g>

</svg>
